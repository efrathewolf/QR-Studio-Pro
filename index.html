<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b7470" />
    <meta name="description" content="QR Studio: advanced QR code creator / creador de códigos QR / créateur de QR codes" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>QR Studio by efrathewolf www.degdl.com</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo.
      (function () {
        try {
          var stored = localStorage.getItem('qr-studio.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
